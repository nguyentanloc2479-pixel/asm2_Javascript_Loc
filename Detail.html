<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gadgetly - Chi tiết sản phẩm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/Style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a class="logo" href="index.html">🪐 Gala<span>xy</span></a>

        <nav class="menu">
          <a href="index.html">Trang chủ</a>
          <a href="products.html" class="active">Sản phẩm</a>
          <a href="cart.html">Giỏ hàng</a>
        </nav>

        <div class="user-area">
          <div id="guestBox">
            <a href="Login.html">Đăng nhập</a>
            <a class="btn btn-small" href="Register.html">Đăng ký</a>
          </div>
          <div id="userBox" class="hidden">
            <span id="userName"></span>
            <button id="logoutBtn" class="btn btn-small btn-outline">Đăng xuất</button>
          </div>
          <a class="cart-link" href="cart.html">🛒 <span id="cartCount">0</span></a>
        </div>
      </div>
    </header>

    <main class="container section">
      <div id="detailBox"></div>

      <div id="relatedSection" class="section">
        <div class="section-head">
          <h2>Sản phẩm liên quan</h2>
        </div>
        <div class="product-grid" id="relatedList"></div>
      </div>
    </main>
    <footer class="footer">
      <div class="container footer-inner">
        <div>
          <div class="logo">🪐 Galaxy<span>ly</span></div>
          <p class="muted">Chạm tay vào vũ trụ ngay tại góc nhỏ sáng tạo.</p>
        </div>
        <div>
          <h4>Mua sắm</h4>
          <a href="products.html">Sản phẩm</a>
          <a href="cart.html">Giỏ hàng</a>
        </div>
        <div>
          <h4>Tài khoản</h4>
          <a href="Login.html">Đăng nhập</a>
          <a href="Register.html">Đăng ký</a>
        </div>
      </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="js/app.js"></script>
  </body>
</html>
