<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gadgetly - Sản phẩm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/Style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a class="logo" href="index.html">🪐 Gala<span>xy</span></a>

        <nav class="menu">
          <a href="index.html">Trang chủ</a>
          <a href="products.html" class="active">Sản phẩm</a>
          <a href="cart.html">Giỏ hàng</a>
        </nav>

        <div class="user-area">
          <div id="guestBox">
            <a href="Login.html">Đăng nhập</a>
            <a class="btn btn-small" href="Register.html">Đăng ký</a>
          </div>
          <div id="userBox" class="hidden">
            <span id="userName"></span>
            <button id="logoutBtn" class="btn btn-small btn-outline">Đăng xuất</button>
          </div>
          <a class="cart-link" href="cart.html">🛒 <span id="cartCount">0</span></a>
        </div>
      </div>
    </header>

    <main class="container section">
      <h1 class="page-title">Tất cả sản phẩm</h1>

      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="🔍 Tìm sản phẩm theo tên..." />

        <select id="priceSelect">
          <option value="all">Mọi mức giá</option>
          <option value="low">Dưới 10 tỷ</option>
          <option value="mid">10 tỷ - 100 tỷ</option>
          <option value="high">Trên 100 tỷ</option>
        </select>

        <select id="sortSelect">
          <option value="default">Sắp xếp theo giá</option>
          <option value="asc">Giá tăng dần</option>
          <option value="desc">Giá giảm dần</option>
        </select>

        <button id="resetBtn" class="btn btn-outline">Xóa bộ lọc</button>
      </div>

      <div class="chips" id="categoryBox"></div>

      <p class="muted" id="resultCount"></p>

      <div class="product-grid" id="productList"></div>

      <div class="empty-box hidden" id="emptyMessage">
        <h2>😢 Không tìm thấy sản phẩm</h2>
        <p>Hãy thử đổi từ khóa hoặc bấm "Xóa bộ lọc".</p>
      </div>
    </main>
    <footer class="footer">
      <div class="container footer-inner">
        <div>
          <div class="logo">🪐 Galaxy<span>ly</span></div>
          <p class="muted">Chạm tay vào vũ trụ ngay tại góc nhỏ sáng tạo.</p>
        </div>
        <div>
          <h4>Mua sắm</h4>
          <a href="products.html">Sản phẩm</a>
          <a href="cart.html">Giỏ hàng</a>
        </div>
        <div>
          <h4>Tài khoản</h4>
          <a href="Login.html">Đăng nhập</a>
          <a href="Register.html">Đăng ký</a>
        </div>
      </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="js/app.js"></script>
  </body>
</html>
